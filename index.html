<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>𝓜𝓗𝓓𝓢𝓗𝓞𝓟</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="#accueil" class="brand">𝓜𝓗𝓓𝓢𝓗𝓞𝓟</a><button id="cartTop">🛒 <b id="cartCount">0</b></button></header>
<main>
<section id="accueil" class="page active"><div class="hero"><small>MHD SHOP</small><h1>Ton univers gaming & digital.</h1><p>Découvre nos offres et prépare ta commande.</p><button class="primary" data-go="boutique">Voir la boutique</button></div><h2>Catégories</h2><div class="cats"><button data-cat="Gaming">🎮<span>Gaming</span></button><button data-cat="eFootball">⚽<span>eFootball</span></button><button data-cat="Digital">💻<span>Digital</span></button><button data-cat="Premium">⭐<span>Premium</span></button></div><h2>Populaires</h2><div id="homeProducts" class="grid"></div></section>
<section id="boutique" class="page"><h1>Boutique</h1><p>Recherche et catégories.</p><input id="search" placeholder="🔎 Rechercher un produit..."><div id="filters" class="chips"></div><div id="shopProducts" class="grid"></div><p id="empty" class="empty">Aucun produit trouvé.</p></section>
<section id="panier" class="page"><h1>Panier</h1><div id="cartItems"></div><div id="summary"></div></section>
<section id="compte" class="page"><h1>Compte</h1><div class="card"><label>Nom<input id="name" placeholder="Ton nom"></label><label>Email<input id="email" type="email" placeholder="ton@email.com"></label><button class="primary" id="save">Enregistrer</button><p id="msg"></p></div></section>
</main>
<nav><button data-go="accueil">⌂<span>Accueil</span></button><button data-go="boutique">🛍️<span>Boutique</span></button><button data-go="panier">🛒<span>Panier</span></button><button data-go="compte">👤<span>Compte</span></button></nav>
<script src="script.js"></script></body></html>
